
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Personal Chat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;
}
header{
 height:70px;padding:12px 18px;
 display:flex;align-items:center;gap:12px;
 border-bottom:1px solid #292929;
 background:#101010;
}
.logo{
 width:43px;height:43px;border-radius:14px;
 background:#252525;display:grid;place-items:center;
 font-size:23px;
}
h2{font-size:20px;margin:0}
small{color:#888;font-size:11px}
main{max-width:900px;margin:auto;padding:20px}
.search{
 width:100%;padding:14px;border-radius:13px;
 border:1px solid #303030;background:#171717;
 color:white;outline:none;font-size:15px;
}
.heading{
 display:flex;justify-content:space-between;
 align-items:center;margin:25px 0 12px;
}
.heading h3{font-size:16px}
.heading span{color:#888;font-size:12px}
.contact{
 display:flex;align-items:center;gap:13px;
 padding:14px 5px;border-bottom:1px solid #222;
 cursor:pointer;
}
.avatar{
 width:49px;height:49px;border-radius:50%;
 background:#292929;display:grid;
 place-items:center;font-size:20px;
}
.info{flex:1;min-width:0}
.info strong{font-size:15px}
.info p{color:#888;font-size:12px;margin:5px 0 0}
.time{color:#777;font-size:11px}
.chat{
 display:none;position:fixed;inset:0;
 background:#090909;z-index:5;
}
.chat header{justify-content:space-between}
.back{
 background:none;color:white;border:0;
 font-size:23px;cursor:pointer;
}
.messages{
 height:calc(100% - 145px);
 overflow-y:auto;padding:18px;
 display:flex;flex-direction:column;gap:12px;
}
.bubble{
 max-width:78%;padding:12px 15px;
 border-radius:15px;background:#242424;
 align-self:flex-start;overflow-wrap:anywhere;
}
.mine{
 background:#315d49;align-self:flex-end;
}
.send{
 position:absolute;bottom:0;width:100%;
 display:flex;gap:8px;padding:12px;
 background:#111;border-top:1px solid #292929;
}
.send input{
 flex:1;min-width:0;background:#222;
 border:0;border-radius:25px;padding:14px;
 color:white;outline:none;
}
.send button{
 border:0;border-radius:50%;width:48px;
 background:#d6d6d6;font-size:19px;
}
footer{
 position:fixed;bottom:0;left:0;right:0;
 background:#111;border-top:1px solid #292929;
 display:flex;justify-content:space-around;
 padding:15px;color:#aaa;font-size:12px;
}
@media(min-width:600px){
 .chat{left:50%;transform:translateX(-50%);
 width:480px;border-left:1px solid #333;
 border-right:1px solid #333}
}
</style>
</head>
<body>
<header>
 <div class="logo">✉</div>
 <div>
  <h2>Personal Chat</h2>
  <small>PRIVATE MESSAGING</small>
 </div>
</header>

<main>
 <input class="search" id="search"
 placeholder="Search contacts..." oninput="filterChats()">

 <div class="heading">
  <h3>Recent Chats</h3>
  <span>YOUR MESSAGES</span>
 </div>

 <div id="contacts">
  <div class="contact" onclick="openChat('Rahul','👤')">
   <div class="avatar">👤</div>
   <div class="info"><strong>Rahul</strong>
    <p>Start a conversation</p></div>
   <span class="time">Now</span>
  </div>
  <div class="contact" onclick="openChat('Aman','🙂')">
   <div class="avatar">🙂</div>
   <div class="info"><strong>Aman</strong>
    <p>Say hello!</p></div>
   <span class="time">Now</span>
  </div>
  <div class="contact" onclick="openChat('Sakib','🧑')">
   <div class="avatar">🧑</div>
   <div class="info"><strong>Sakib</strong>
    <p>Start a conversation</p></div>
   <span class="time">Now</span>
  </div>
 </div>
</main>

<footer>
 <span>💬 Chats</span>
 <span>👥 Contacts</span>
 <span>👤 Profile</span>
 <span>⚙ Settings</span>
</footer>

<div class="chat" id="chat">
 <header>
  <button class="back" onclick="closeChat()">←</button>
  <div style="flex:1">
   <h2 id="chatName">Chat</h2>
   <small>Personal Chat</small>
  </div>
  <span>⋮</span>
 </header>
 <div class="messages" id="messages">
  <div class="bubble">Welcome to Personal Chat 🖤</div>
 </div>
 <div class="send">
  <input id="message" placeholder="Write a message..."
   onkeydown="if(event.key==='Enter')sendMessage()">
  <button onclick="sendMessage()">➤</button>
 </div>
</div>

<script>
let currentChat="";
let chats={};

function openChat(name,emoji){
 currentChat=name;
 document.getElementById("chatName").textContent=emoji+" "+name;
 document.getElementById("chat").style.display="block";
 showMessages();
}
function closeChat(){
 document.getElementById("chat").style.display="none";
}
function sendMessage(){
 const input=document.getElementById("message");
 const value=input.value.trim();
 if(!value || !currentChat)return;
 if(!chats[currentChat])chats[currentChat]=[];
 chats[currentChat].push(value);
 input.value="";
 showMessages();
}
function showMessages(){
 const box=document.getElementById("messages");
 box.innerHTML="";
 (chats[currentChat]||[]).forEach(msg=>{
  const div=document.createElement("div");
  div.className="bubble mine";
  div.textContent=msg;
  box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}
function filterChats(){
 const value=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".contact").forEach(item=>{
  item.style.display=item.innerText.toLowerCase().includes(value)
   ?"flex":"none";
 });
}
</script>
</body>
</html>
